name: Deploy

# CI proves the change; this workflow ships it. A push to main builds one image, pushes it to ECR
# and rolls the ECS service onto it. Run it by hand from the Actions tab with "Run workflow".
on:
  push:
    branches: [main, lesson2-cicd] # lesson2-cicd: classroom demo branch until merged
  workflow_dispatch:

# One deploy at a time per repository; a newer push waits rather than racing.
concurrency:
  group: deploy-agrivibe
  cancel-in-progress: false

# Only what the jobs need: read the code, and ask GitHub for an OIDC token to give AWS.
permissions:
  contents: read
  id-token: write

env:
  ECR_REPOSITORY: agrivibe-fieldsat
  CONTAINER_NAME: fieldsat
  ECS_CLUSTER: agrivibe
  ECS_SERVICE: agrivibe
  TASK_FAMILY: agrivibe

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uvx ruff check src tests
      - run: uv run pytest

  deploy:
    needs: test
    runs-on: ubuntu-24.04-arm # ECS runs ARM64 (Graviton); building on an ARM runner avoids emulation
    environment: course       # the AWS role trusts this environment, not a branch or a person
    steps:
      - uses: actions/checkout@v7

      - name: Log in to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push (tag = commit SHA; the repository refuses to overwrite a tag)
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Download the running task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Put the new image, by digest, into this repository's container only
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1.9.1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}

      - name: Register the revision and roll the service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true # fails the run if the new task never turns healthy
