[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fieldsat"
version = "0.3.0"
description = "Field-level satellite and weather evidence for AgriVibe, served over MCP with FastMCP"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "UNLICENSED" }
dependencies = [
  "fastmcp>=4.1,<4.2",
  "httpx>=0.28,<1",
  "mcp>=2.2,<3",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.2,<2",
]

[project.scripts]
fieldsat = "fieldsat.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "uvicorn>=0.35,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fieldsat"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "TID", "UP"]

[tool.ruff.lint.flake8-tidy-imports]
# Import the package by name (from fieldsat.domain import ...), never relative to the file.
ban-relative-imports = "all"
